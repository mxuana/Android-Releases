name: Verify YogurtCat 5.41-preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout YogurtCat
        uses: actions/checkout@v4
        with:
          repository: mxuana/YogurtCat
          ref: f63a3dfaff1857a98d263862a4999ea61120eb4e

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release-key.p12

      - name: Build signed release
        env:
          VERSION_CODE: '500041'
          VERSION_NAME: '5.41-preview'
          ANDROID_KEYSTORE_PATH: release-key.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Compare signing certificates
        run: |
          curl -fLsS --retry 3 -o old.apk https://github.com/mxuana/Android-Releases/releases/download/v5.39/YogurtCat-5.39.apk
          NEW_APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -s "$NEW_APK"
          test -n "$APKSIGNER"

          "$APKSIGNER" verify --print-certs --min-sdk-version 24 old.apk > old-cert.txt 2>&1
          "$APKSIGNER" verify --print-certs --min-sdk-version 24 "$NEW_APK" > new-cert.txt 2>&1

          echo "Old certificate:"
          cat old-cert.txt
          echo "New certificate:"
          cat new-cert.txt

          OLD_SHA=$(sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' old-cert.txt | head -1)
          NEW_SHA=$(sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' new-cert.txt | head -1)

          test -n "$OLD_SHA"
          test -n "$NEW_SHA"
          test "$OLD_SHA" = "$NEW_SHA"
          echo "Signing certificates match"

          AAPT="$(dirname "$APKSIGNER")/aapt"
          "$AAPT" dump badging "$NEW_APK" > new-badging.txt
          grep -F "package: name='com.example.change2proimage' versionCode='500041' versionName='5.41-preview'" new-badging.txt
          (cd "$(dirname "$NEW_APK")" && sha256sum app-release.apk > app-release.apk.sha256)

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: YogurtCat-5.41-preview-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
